<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GPS トラッカー">
    <meta name="theme-color" content="#020617">
    <title>GPS トラッカー</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857'
                        }
                    }
                }
            }
        };
    </script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- JSZip for KMZ extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- toGeoJSON for KML parsing -->
    <script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        // iPhone / iPad 用のホーム画面アプリアイコンおよびファビコンを動的生成
        (function() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 180;
                canvas.height = 180;
                const ctx = canvas.getContext('2d');
                if (ctx) {
                    const grad = ctx.createLinearGradient(0, 0, 180, 180);
                    grad.addColorStop(0, '#10b981');
                    grad.addColorStop(1, '#047857');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, 180, 180);

                    // マップピンのシルエットを描画
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(90, 72, 34, Math.PI, 0, false);
                    ctx.bezierCurveTo(124, 98, 90, 142, 90, 142);
                    ctx.bezierCurveTo(90, 142, 56, 98, 56, 72);
                    ctx.closePath();
                    ctx.fill();

                    // ピンの中央ホール
                    ctx.fillStyle = '#059669';
                    ctx.beginPath();
                    ctx.arc(90, 72, 14, 0, Math.PI * 2, true);
                    ctx.fill();

                    const iconUrl = canvas.toDataURL('image/png');
                    const appleIcon = document.createElement('link');
                    appleIcon.rel = 'apple-touch-icon';
                    appleIcon.href = iconUrl;
                    document.head.appendChild(appleIcon);

                    const fav = document.createElement('link');
                    fav.rel = 'icon';
                    fav.type = 'image/png';
                    fav.href = iconUrl;
                    document.head.appendChild(fav);
                }
            } catch (e) {
                console.warn('Icon generator warning:', e);
            }
        })();
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .leaflet-popup-content-wrapper { border-radius: 12px; padding: 4px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15); }
        .leaflet-container { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .pulse-dot {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse-ring 1.8s infinite cubic-bezier(0.66, 0, 0, 1);
        }
        @keyframes pulse-ring {
            to { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen w-screen overflow-hidden select-none">

                                    <button class="color-preset w-5 h-5 rounded-full border border-white/40 shrink-0" data-color="#f59e0b" style="background:#f59e0b;"></button>
                                    <button class="color-preset w-5 h-5 rounded-full border border-white/40 shrink-0" data-color="#8b5cf6" style="background:#8b5cf6;"></button>
                                    <button class="color-preset w-5 h-5 rounded-full border border-white/40 shrink-0" data-color="#eab308" style="background:#eab308;"></button>
                                </div>
                            </div>

                build version
            </span>
            <span class="text-slate-300 font-semibold">v2026.10.06-0956</span>
        </div>
    </aside>

    <main class="flex-1 h-full w-full relative">
        <div id="map" class="w-full h-full z-10 bg-slate-950"></div>

        <!-- Floating Button: Show Sidebar -->

    <div id="confirm-modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">

            <p id="modal-desc" class="text-xs text-slate-300 leading-relaxed mb-5">この操作を実行してもよろしいですか？</p>
            <div class="flex justify-end gap-2.5">
                <button id="modal-btn-cancel" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium rounded-xl transition-colors">キャンセル</button>

            </div>
        </div>
    </div>

    <script>
        // 福島県郡山市中心部（初期位置）
        const DEFAULT_LAT = 37.3980;
        const DEFAULT_LNG = 140.3880;
        const DEFAULT_ZOOM = 13;

        // タイル定義（完全無料・APIキー不要なプロバイダーのみ）
        const TILE_PROVIDERS = {
            gsi_pale: {
                url: 'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
                options: { maxZoom: 18, attribution: '&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>' }
            },
            gsi_std: {
                url: 'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
                options: { maxZoom: 18, attribution: '&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>' }
            },
            gsi_photo: {
                url: 'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
                options: { maxZoom: 18, attribution: '&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>' }
            },
            gsi_blank: {
                url: 'https://cyberjapandata.gsi.go.jp/xyz/blank/{z}/{x}/{y}.png',
                options: { maxZoom: 14, attribution: '&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>' }
            },
            osm: {
                url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                options: { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }
            },
            opentopo: {
                url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
                options: { maxZoom: 17, attribution: 'Map data: &copy; OSM, SRTM | Map style: &copy; OpenTopoMap' }
            },
            esri_world: {
                url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                options: { maxZoom: 18, attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community' }
            }
        };

        // アプリ状態
        let map;
        let currentTileLayer;
        let isTracking = false;
        let watchId = null;
        let wakeLock = null;
        let autoFollowMode = true; // デフォルトON
        let trackPoints = []; // [{lat, lng, alt, speed, accuracy, timestamp}]
        let trackPolyline = null;
        let currentMarker = null;
        let maxSpeedKmh = 0;
        let totalDistanceKm = 0;
        let importedLayers = []; // [{id, name, layer, count, color, weight, opacity, visible}]
        let demoInterval = null;

        // 軌跡スタイル状態（デフォルト: 赤色 #ef4444, 太さ 10px）
        let trackStyle = {
            color: '#ef4444',
            weight: 10,
            opacity: 1.0
        };

        window.addEventListener('DOMContentLoaded', () => {
            initApp();
        });

        function initApp() {
            // Leaflet マップ初期化
            map = L.map('map', {
                zoomControl: false,
                tap: true
            }).setView([DEFAULT_LAT, DEFAULT_LNG], DEFAULT_ZOOM);

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // 初回タイルセット（国土地理院 淡色地図）
            currentTileLayer = L.tileLayer(TILE_PROVIDERS.gsi_pale.url, TILE_PROVIDERS.gsi_pale.options).addTo(map);

            // 保存された軌跡スタイルを復元
            loadSavedTrackStyle();

            // 軌跡用ポリライン作成
            trackPolyline = L.polyline([], {
                color: trackStyle.color,
                weight: trackStyle.weight,
                opacity: trackStyle.opacity,
                lineCap: 'round',
                lineJoin: 'round'
            }).addTo(map);

            // ローカルストレージから前回のトラックを復元
            restoreSavedTrack();

            // ユーザーが手動でマップをドラッグした場合は自動追従を一時停止
            map.on('dragstart', () => {
                if (autoFollowMode) {
                    setAutoFollow(false);
                    showToast('地図を操作したため、自動追従を一時停止しました', 'info');
                }
            });

            // イベントリスナーの登録
            setupEventListeners();
            lucide.createIcons();

            // 起動トースト
            showToast('GPS トラッカーの準備が完了しました', 'success');
        }

        function setupEventListeners() {
            // 背景地図セレクタ
            document.getElementById('tile-select').addEventListener('change', (e) => {
                const prov = TILE_PROVIDERS[e.target.value];
                if (prov) {
                    map.removeLayer(currentTileLayer);
                    currentTileLayer = L.tileLayer(prov.url, prov.options).addTo(map);
                }
            });

            // サイドバー開閉
            const sidebar = document.getElementById('sidebar');
            const btnShowSidebar = document.getElementById('btn-show-sidebar');
            const btnToggleSidebar = document.getElementById('btn-toggle-sidebar');

            btnToggleSidebar.addEventListener('click', () => {
                sidebar.classList.add('-translate-x-full');
                btnShowSidebar.classList.remove('hidden');
                setTimeout(() => map.invalidateSize(), 310);
            });

            btnShowSidebar.addEventListener('click', () => {
                sidebar.classList.remove('-translate-x-full');
                btnShowSidebar.classList.add('hidden');
                setTimeout(() => map.invalidateSize(), 310);
            });

            // トラッキング開始・停止
            document.getElementById('btn-toggle-tracking').addEventListener('click', toggleTracking);

            // 軌跡クリア
            document.getElementById('btn-clear-track').addEventListener('click', () => {
                if (trackPoints.length === 0) {
                    showToast('クリアする軌跡データがありません', 'info');
                    return;
                }
                showConfirm('軌跡データの消去', '記録した移動軌跡をすべて消去しますか？（この操作は元に戻せません）', () => {
                    clearTrackData();
                });
            });

            // デモ走行
            document.getElementById('btn-demo-track').addEventListener('click', toggleDemoDrive);

            // 自動追従ボタン
            document.getElementById('btn-toggle-follow').addEventListener('click', () => {
                setAutoFollow(!autoFollowMode);
            });

            // 現在地へ移動
            document.getElementById('btn-recenter').addEventListener('click', () => {
                if (trackPoints.length > 0) {
                    const last = trackPoints[trackPoints.length - 1];
                    map.flyTo([last.lat, last.lng], 16, { duration: 0.8 });
                    setAutoFollow(true);
                } else {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            const latlng = [pos.coords.latitude, pos.coords.longitude];
                            map.flyTo(latlng, 16, { duration: 0.8 });
                            setAutoFollow(true);
                        },
                        () => {
                            map.flyTo([DEFAULT_LAT, DEFAULT_LNG], DEFAULT_ZOOM, { duration: 0.8 });
                            showToast('福島県郡山市に移動しました', 'info');
                        }
                    );
                }
            });

            // 軌跡スタイル アコーディオン開閉
            document.getElementById('btn-toggle-track-style').addEventListener('click', () => {
                const panel = document.getElementById('track-style-panel');
                const arrow = document.getElementById('track-style-arrow');
                panel.classList.toggle('hidden');
                arrow.classList.toggle('rotate-180');
            });

            // 軌跡スタイル コントロール
            const colorPicker = document.getElementById('track-color-picker');
            sliderWidth = document.getElementById('slider-track-width');
            sliderOpacity = document.getElementById('slider-track-opacity');

            colorPicker.addEventListener('input', (e) => {
                applyTrackStyle({ color: e.target.value });
            });

            document.querySelectorAll('.color-preset').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const col = e.currentTarget.getAttribute('data-color');
                    colorPicker.value = col;
                    applyTrackStyle({ color: col });
                });
            });

            sliderWidth.addEventListener('input', (e) => {
                applyTrackStyle({ weight: parseInt(e.target.value, 10) });
            });

            sliderOpacity.addEventListener('input', (e) => {
                applyTrackStyle({ opacity: parseInt(e.target.value, 10) / 100 });
            });

            // ファイルドロップ & インポート
            const dropzone = document.getElementById('dropzone');
            const fileInput = document.getElementById('file-input');

            dropzone.addEventListener('click', () => fileInput.click());
            dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropzone.classList.add('border-sky-400', 'bg-sky-950/40');
            });
            dropzone.addEventListener('dragleave', () => {
                dropzone.classList.remove('border-sky-400', 'bg-sky-950/40');
            });
            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('border-sky-400', 'bg-sky-950/40');
                if (e.dataTransfer.files?.length) {
                    handleFiles(e.dataTransfer.files);
                }
            });
            fileInput.addEventListener('change', (e) => {
                if (e.target.files?.length) {
                    handleFiles(e.target.files);
                    fileInput.value = '';
                }
            });

            // エクスポートボタン群
            document.getElementById('btn-export-gpx').addEventListener('click', () => exportTrack('gpx'));
            document.getElementById('btn-export-kml').addEventListener('click', () => exportTrack('kml'));
            document.getElementById('btn-export-share').addEventListener('click', shareTrackFile);
        }

        function toggleTracking() {
            if (isTracking) {
                stopTracking();
            } else {
                startTracking();
            }
        }

        async function startTracking() {
            if (!('geolocation' in navigator)) {
                showToast('お使いの環境では位置情報（GPS）がサポートされていません', 'error');
                return;
            }

            requestWakeLock();

            const statusBadge = document.getElementById('gps-status-badge');
            statusBadge.className = 'px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-900/60 text-emerald-300 border border-emerald-500/40 animate-pulse';
            statusBadge.textContent = '測位中...';

            const btn = document.getElementById('btn-toggle-tracking');
            btn.className = 'w-full py-2.5 px-4 bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white font-semibold text-sm rounded-xl shadow-lg shadow-rose-900/30 transition-all flex items-center justify-center gap-2';
            btn.innerHTML = '<i data-lucide="square" class="w-4 h-4 fill-current"></i><span>トラッキング停止</span>';
            lucide.createIcons();

            isTracking = true;

            const options = {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 1000
            };

            watchId = navigator.geolocation.watchPosition(handlePositionSuccess, handlePositionError, options);
            showToast('GPSトラッキングを開始しました', 'success');
        }

        function stopTracking() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            releaseWakeLock();

            isTracking = false;
            const statusBadge = document.getElementById('gps-status-badge');
            statusBadge.className = 'px-2 py-0.5 rounded-full text-[10px] font-medium bg-slate-700 text-slate-300';
            statusBadge.textContent = '待機中';

            const btn = document.getElementById('btn-toggle-tracking');
            btn.className = 'w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-semibold text-sm rounded-xl shadow-lg shadow-emerald-900/30 transition-all flex items-center justify-center gap-2';
            btn.innerHTML = '<i data-lucide="play" class="w-4 h-4 fill-current"></i><span>トラッキング開始</span>';
            lucide.createIcons();

            showToast('GPSトラッキングを停止しました', 'info');
        }

        function handlePositionSuccess(pos) {
            const coords = pos.coords;
            const pt = {
                lat: coords.latitude,
                lng: coords.longitude,
                alt: coords.altitude || 0,
                speed: coords.speed !== null && !isNaN(coords.speed) ? Math.max(0, coords.speed * 3.6) : 0,
                accuracy: coords.accuracy || 0,
                timestamp: new Date().toISOString()
            };

            appendTrackPoint(pt);

            const statusBadge = document.getElementById('gps-status-badge');
            statusBadge.className = 'px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-900/60 text-emerald-300 border border-emerald-500/40';
            statusBadge.textContent = `記録中 (±${Math.round(pt.accuracy)}m)`;
        }

        function handlePositionError(err) {
            console.warn('GPS Watch Error:', err.code, err.message);
            if (err.code === 1) {
                showToast('位置情報の利用が拒否されました。設定から位置情報を許可してください', 'error');
                stopTracking();
            } else if (err.code === 2) {
                showToast('位置情報を検出できません（電波状態をご確認ください）', 'error');
            } else if (err.code === 3) {
                showToast('測位がタイムアウトしました。再試行中...', 'info');
            }
        }

        function appendTrackPoint(pt) {
            if (trackPoints.length > 0) {
                const prev = trackPoints[trackPoints.length - 1];
                const d = calcDistance(prev.lat, prev.lng, pt.lat, pt.lng);
                totalDistanceKm += d;
            }
            trackPoints.push(pt);

            if (pt.speed > maxSpeedKmh) {
                maxSpeedKmh = pt.speed;
            }

            // 地図上のライン更新
            trackPolyline.addLatLng([pt.lat, pt.lng]);

            // 現在地マーカー更新
            updateCurrentMarker(pt.lat, pt.lng);

            // 自動追従が有効なら現在地へスクロール
            if (autoFollowMode) {
                map.panTo([pt.lat, pt.lng], { animate: true, duration: 0.6 });
            }

            // 統計表示更新
            updateStatsUI(pt.speed);

            // ローカルストレージに自動保存
            saveTrackToStorage();
        }

        function updateCurrentMarker(lat, lng) {
            if (!currentMarker) {
                const pulseIcon = L.divIcon({
                    className: 'relative flex items-center justify-center',
                    html: `<div class="pulse-dot w-4 h-4 rounded-full border-2 border-white" style="background-color: ${trackStyle.color};"></div>`,
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });
                currentMarker = L.marker([lat, lng], { icon: pulseIcon, zIndexOffset: 1000 }).addTo(map);
            } else {
                currentMarker.setLatLng([lat, lng]);
                const el = currentMarker.getElement();
                if (el) {
                    const dot = el.querySelector('.pulse-dot');
                    if (dot) dot.style.backgroundColor = trackStyle.color;
                }
            }
        }

        function updateStatsUI(currentSpeed) {
            document.getElementById('stat-distance').innerHTML = `${totalDistanceKm.toFixed(2)} <span class="text-xs font-normal text-slate-400">km</span>`;
            document.getElementById('stat-speed').innerHTML = `${currentSpeed.toFixed(1)} <span class="text-xs font-normal text-slate-400">km/h</span>`;
            document.getElementById('stat-max-speed').textContent = `${maxSpeedKmh.toFixed(1)} km/h`;
            document.getElementById('stat-points').textContent = `${trackPoints.length} 点`;
        }

        function calcDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // 地球半径 (km)
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function setAutoFollow(enabled) {
            autoFollowMode = enabled;
            const btn = document.getElementById('btn-toggle-follow');
            const txt = document.getElementById('follow-status-text');

            if (enabled) {
                btn.className = 'absolute top-4 right-4 z-20 bg-emerald-600 text-white border border-emerald-400/50 rounded-xl p-3 shadow-xl backdrop-blur-md flex items-center gap-2 text-xs font-semibold transition-all';
                txt.textContent = '追従 ON';
                if (trackPoints.length > 0) {
                    const last = trackPoints[trackPoints.length - 1];
                    map.panTo([last.lat, last.lng], { animate: true });
                }
            } else {
                btn.className = 'absolute top-4 right-4 z-20 bg-slate-900/90 text-slate-400 border border-slate-700/80 rounded-xl p-3 shadow-xl backdrop-blur-md flex items-center gap-2 text-xs font-semibold transition-all hover:text-white';
                txt.textContent = '追従 OFF';
            }
        }

        function applyTrackStyle(newStyle) {
            if (newStyle.color) trackStyle.color = newStyle.color;
            if (newStyle.weight !== undefined) trackStyle.weight = newStyle.weight;
            if (newStyle.opacity !== undefined) trackStyle.opacity = newStyle.opacity;

            // UIコントロールに同期
            document.getElementById('lbl-track-color').textContent = trackStyle.color;
            document.getElementById('track-style-preview').style.backgroundColor = trackStyle.color;
            document.getElementById('lbl-track-width').textContent = `${trackStyle.weight} px`;
            document.getElementById('slider-track-width').value = trackStyle.weight;
            document.getElementById('lbl-track-opacity').textContent = `${Math.round(trackStyle.opacity * 100)} %`;
            document.getElementById('slider-track-opacity').value = Math.round(trackStyle.opacity * 100);

            // ポリラインとマーカーに即時反映
            if (trackPolyline) {
                trackPolyline.setStyle({
                    color: trackStyle.color,
                    weight: trackStyle.weight,
                    opacity: trackStyle.opacity
                });
            }
            if (currentMarker) {
                const el = currentMarker.getElement();
                if (el) {
                    const dot = el.querySelector('.pulse-dot');
                    if (dot) dot.style.backgroundColor = trackStyle.color;
                }
            }

            try {
                localStorage.setItem('gps_track_style_v3', JSON.stringify(trackStyle));
            } catch (e) {
                console.warn('Style storage failed', e);
            }
        }

        function loadSavedTrackStyle() {
            try {
                const saved = localStorage.getItem('gps_track_style_v3');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    applyTrackStyle(parsed);
                    return;
                }
            } catch (e) {}
            // デフォルトスタイルを適用（赤, 10px）
            applyTrackStyle(trackStyle);
        }

        function saveTrackToStorage() {
            try {
                localStorage.setItem('gps_recorded_track_v2', JSON.stringify({
                    points: trackPoints,
                    totalDistanceKm,
                    maxSpeedKmh
                }));
            } catch (e) {
                console.warn('Storage save failed', e);
            }
        }

        function restoreSavedTrack() {
            try {
                const raw = localStorage.getItem('gps_recorded_track_v2');
                if (!raw) return;
                const data = JSON.parse(raw);
                if (data && Array.isArray(data.points) && data.points.length > 0) {
                    trackPoints = data.points;
                    totalDistanceKm = data.totalDistanceKm || 0;
                    maxSpeedKmh = data.maxSpeedKmh || 0;

                    const latlngs = trackPoints.map(p => [p.lat, p.lng]);
                    trackPolyline.setLatLngs(latlngs);

                    const last = trackPoints[trackPoints.length - 1];
                    updateCurrentMarker(last.lat, last.lng);
                    updateStatsUI(last.speed || 0);

                    // 軌跡全体が収まるようにズーム調整
                    map.fitBounds(trackPolyline.getBounds(), { padding: [40, 40], maxZoom: 16 });
                    showToast(`前回の移動軌跡（${trackPoints.length}点）を復元しました`, 'info');
                }
            } catch (e) {
                console.warn('Restore failed:', e);
            }
        }

        function clearTrackData() {
            if (demoInterval) {
                clearInterval(demoInterval);
                demoInterval = null;
            }
            trackPoints = [];
            totalDistanceKm = 0;
            maxSpeedKmh = 0;
            trackPolyline.setLatLngs([]);
            if (currentMarker) {
                map.removeLayer(currentMarker);
                currentMarker = null;
            }
            updateStatsUI(0);
            localStorage.removeItem('gps_recorded_track_v2');
            showToast('軌跡データを消去しました', 'success');
        }

        function toggleDemoDrive() {
            if (demoInterval) {
                clearInterval(demoInterval);
                demoInterval = null;
                showToast('デモ走行を停止しました', 'info');
                return;
            }

            let centerLat = DEFAULT_LAT;
            let centerLng = DEFAULT_LNG;
            if (trackPoints.length > 0) {
                const last = trackPoints[trackPoints.length - 1];
                centerLat = last.lat;
                centerLng = last.lng;
            }

            let angle = 0;
            showToast('PC用デモ走行テストを開始しました', 'success');

            demoInterval = setInterval(() => {
                angle += 0.08;
                const lat = centerLat + Math.sin(angle) * 0.003 + (Math.random() - 0.5) * 0.0003;
                const lng = centerLng + Math.cos(angle) * 0.004 + (Math.random() - 0.5) * 0.0003;
                const speed = 25 + Math.sin(angle * 3) * 15;

                appendTrackPoint({
                    lat,
                    lng,
                    alt: 230 + Math.sin(angle) * 15,
                    speed: Math.max(5, speed),
                    accuracy: 4.5,
                    timestamp: new Date().toISOString()
                });
            }, 1200);
        }

        async function handleFiles(files) {
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const ext = file.name.split('.').pop().toLowerCase();
                try {
                    if (ext === 'kml') {
                        const text = await file.text();
                        loadKmlContent(text, file.name);
                    } else if (ext === 'kmz') {
                        await loadKmzContent(file);
                    } else {
                        showToast(`未対応のファイル形式です: ${file.name}`, 'error');
                    }
                } catch (err) {
                    console.error('File parsing error:', err);
                    showToast(`読み込み失敗 (${file.name}): ${err.message}`, 'error');
                }
            }
        }

        async function loadKmzContent(file) {
            const zip = new JSZip();
            const loadedZip = await zip.loadAsync(file);
            let kmlFile = loadedZip.file(/\.kml$/i)[0];
            if (!kmlFile) {
                kmlFile = loadedZip.file('doc.kml');
            }
            if (!kmlFile) {
                throw new Error('KMZ内に有効なKMLファイルが見つかりません');
            }
            const kmlText = await kmlFile.async('text');
            loadKmlContent(kmlText, file.name);
        }

        function kmlColorToHex(kmlColor) {
            if (!kmlColor || typeof kmlColor !== 'string') return null;
            const clean = kmlColor.trim().replace(/^#/, '');
            if (clean.length === 8) {
                const a = parseInt(clean.substring(0, 2), 16) / 255;
                const b = clean.substring(2, 4);
                const g = clean.substring(4, 6);
                const r = clean.substring(6, 8);
                return { hex: `#${r}${g}${b}`.toLowerCase(), opacity: Math.round(a * 100) / 100 };
            } else if (clean.length === 6) {
                return { hex: `#${clean}`.toLowerCase(), opacity: 1 };
            }
            return null;
        }

        function extractKmlStyleMap(kmlDoc) {
            const styleCatalog = {};
            const styles = kmlDoc.querySelectorAll('Style');
            styles.forEach(s => {
                const id = s.getAttribute('id');
                if (!id) return;
                const lineStyle = s.querySelector('LineStyle');
                const polyStyle = s.querySelector('PolyStyle');
                const parsed = {};
                if (lineStyle) {
                    const c = lineStyle.querySelector('color')?.textContent;
                    const w = lineStyle.querySelector('width')?.textContent;
                    if (c) {
                        const conv = kmlColorToHex(c);
                        if (conv) { parsed.color = conv.hex; parsed.opacity = conv.opacity; }
                    }
                    if (w) parsed.weight = parseFloat(w);
                }
                if (polyStyle) {
                    const c = polyStyle.querySelector('color')?.textContent;
                    if (c) {
                        const conv = kmlColorToHex(c);
                        if (conv) { parsed.fillColor = conv.hex; parsed.fillOpacity = conv.opacity; }
                    }
                }
                styleCatalog[`#${id}`] = parsed;
                styleCatalog[id] = parsed;
            });

            const styleMaps = kmlDoc.querySelectorAll('StyleMap');
            styleMaps.forEach(sm => {
                const id = sm.getAttribute('id');
                if (!id) return;
                const pairs = sm.querySelectorAll('Pair');
                let targetUrl = null;
                pairs.forEach(p => {
                    const key = p.querySelector('key')?.textContent?.trim();
                    const url = p.querySelector('styleUrl')?.textContent?.trim();
                    if (key === 'normal' && url) targetUrl = url;
                    else if (!targetUrl && url) targetUrl = url;
                });
                if (targetUrl && styleCatalog[targetUrl]) {
                    styleCatalog[`#${id}`] = styleCatalog[targetUrl];
                    styleCatalog[id] = styleCatalog[targetUrl];
                }
            });

            return styleCatalog;
        }

        function loadKmlContent(kmlText, fileName) {
            const parser = new DOMParser();
            const kmlDom = parser.parseFromString(kmlText, 'text/xml');
            const parseError = kmlDom.querySelector('parsererror');
            if (parseError) {
                throw new Error('KMLのXMLパースに失敗しました');
            }

            const styleCatalog = extractKmlStyleMap(kmlDom);
            const geojson = toGeoJSON.kml(kmlDom);
            if (!geojson || !geojson.features || geojson.features.length === 0) {
                throw new Error('地物（ルート・ピン情報）が含まれていません');
            }

            // 代表スタイルの検出
            let initialColor = '#0284c7';
            let initialWeight = 4;
            let initialOpacity = 0.85;

            for (const key in styleCatalog) {
                if (styleCatalog[key]?.color) {
                    initialColor = styleCatalog[key].color;
                    if (styleCatalog[key].weight) initialWeight = Math.min(10, Math.max(2, styleCatalog[key].weight));
                    if (styleCatalog[key].opacity !== null) initialOpacity = styleCatalog[key].opacity;
                    break;
                }
            }

            function resolveFeatureStyle(feature) {
                const styleUrl = feature.properties?.styleUrl;
                const direct = (styleUrl && styleCatalog[styleUrl]) ? styleCatalog[styleUrl] : {};
                return {
                    color: direct.color || feature.properties?.stroke || initialColor,
                    weight: direct.weight || feature.properties?.['stroke-width'] || initialWeight,
                    opacity: direct.opacity !== undefined ? direct.opacity : initialOpacity,
                    fillColor: direct.fillColor || direct.color || feature.properties?.fill || initialColor,
                    fillOpacity: direct.fillOpacity !== undefined ? direct.fillOpacity : (initialOpacity * 0.4)
                };
            }

            // GeoJSON レイヤー構築（標準的で軽量なサークルマーカーとポップアップ）
            const geoJsonLayer = L.geoJSON(geojson, {
                style: function(feature) {
                    const st = resolveFeatureStyle(feature);
                    return {
                        color: st.color,
                        weight: st.weight,
                        opacity: st.opacity,
                        fillColor: st.fillColor,
                        fillOpacity: st.fillOpacity
                    };
                },
                pointToLayer: function(feature, latlng) {
                    const st = resolveFeatureStyle(feature);
                    return L.circleMarker(latlng, {
                        radius: Math.max(5, Math.min(10, st.weight + 2)),
                        fillColor: st.color,
                        color: '#ffffff',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: st.opacity
                    });
                },
                onEachFeature: function(feature, layer) {
                    if (feature.properties) {
                        const props = feature.properties;
                        let popupHtml = '<div class="p-2 text-slate-800 text-xs space-y-1">';
                        if (props.name) popupHtml += `<h4 class="font-bold border-b pb-1 text-slate-900">${props.name}</h4>`;
                        if (props.description) popupHtml += `<p class="text-[11px] text-slate-600 leading-snug">${props.description}</p>`;
                        popupHtml += '</div>';
                        layer.bindPopup(popupHtml);
                    }
                }
            }).addTo(map);

            const bounds = geoJsonLayer.getBounds();
            if (bounds.isValid()) {
                map.fitBounds(bounds, { padding: [40, 40] });
                setAutoFollow(false);
            }

            const layerId = 'layer_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            const layerItem = {
                id: layerId,
                name: fileName,
                layer: geoJsonLayer,
                count: geojson.features.length,
                color: initialColor,
                weight: initialWeight,
                opacity: initialOpacity,
                visible: true
            };

            importedLayers.push(layerItem);
            renderLayerList();
            showToast(`${fileName} を読み込みました（${geojson.features.length} 地物）`, 'success');
        }

        function renderLayerList() {
            const container = document.getElementById('layer-list');
            const countBadge = document.getElementById('layer-count-badge');

            countBadge.textContent = `${importedLayers.length} ファイル`;

            if (importedLayers.length === 0) {
                container.innerHTML = '<div id="no-layers-msg" class="text-center py-3 text-xs text-slate-500">インポートされたレイヤーはありません</div>';
                return;
            }

            container.innerHTML = '';
            importedLayers.forEach((item) => {
                const el = document.createElement('div');
                el.className = 'bg-slate-900/90 rounded-xl p-2.5 border border-slate-700/60 space-y-2';
                el.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2 overflow-hidden flex-1 mr-2">
                            <span class="w-3 h-3 rounded-full shrink-0 border border-white/40" style="background-color: ${item.color};"></span>
                            <span class="text-xs font-semibold text-slate-200 truncate" title="${item.name}">${item.name}</span>
                            <span class="text-[10px] text-slate-400 font-mono shrink-0">(${item.count})</span>
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            <button class="btn-toggle-vis p-1 text-slate-400 hover:text-white rounded" title="表示/非表示">
                                <i data-lucide="${item.visible ? 'eye' : 'eye-off'}" class="w-3.5 h-3.5"></i>
                            </button>
                            <button class="btn-toggle-style p-1 text-slate-400 hover:text-white rounded" title="スタイル編集">
                                <i data-lucide="palette" class="w-3.5 h-3.5 text-sky-400"></i>
                            </button>
                            <button class="btn-remove-layer p-1 text-slate-400 hover:text-rose-400 rounded" title="削除">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>

                    <!-- スタイル編集サブパネル -->
                    <div class="layer-style-subpanel hidden pt-2 border-t border-slate-800 space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] text-slate-400">カラー</span>
                            <div class="flex items-center gap-1.5">
                                <input type="color" value="${item.color}" class="input-layer-color w-6 h-6 rounded cursor-pointer bg-transparent border-0 p-0">
                                <span class="lbl-layer-color text-[10px] font-mono text-slate-300">${item.color}</span>
                            </div>
                        </div>
                        <div class="flex items-center justify-between gap-2">
                            <span class="text-[10px] text-slate-400 shrink-0">太さ</span>
                            <input type="range" min="1" max="14" value="${item.weight}" class="input-layer-weight w-28 accent-sky-400 h-1 bg-slate-700 rounded cursor-pointer">
                            <span class="lbl-layer-weight text-[10px] font-mono text-slate-300 w-8 text-right">${item.weight}px</span>
                        </div>
                        <div class="flex items-center justify-between gap-2">
                            <span class="text-[10px] text-slate-400 shrink-0">不透明度</span>
                            <input type="range" min="10" max="100" value="${Math.round(item.opacity * 100)}" class="input-layer-opacity w-28 accent-sky-400 h-1 bg-slate-700 rounded cursor-pointer">
                            <span class="lbl-layer-opacity text-[10px] font-mono text-slate-300 w-8 text-right">${Math.round(item.opacity * 100)}%</span>
                        </div>
                    </div>
                `;

                // 表示非表示
                el.querySelector('.btn-toggle-vis').addEventListener('click', () => {
                    item.visible = !item.visible;
                    if (item.visible) {
                        map.addLayer(item.layer);
                    } else {
                        map.removeLayer(item.layer);
                    }
                    renderLayerList();
                });

                // スタイルパネル開閉
                el.querySelector('.btn-toggle-style').addEventListener('click', () => {
                    const subpanel = el.querySelector('.layer-style-subpanel');
                    subpanel.classList.toggle('hidden');
                });

                // スタイル調整ハンドラ
                const colorInput = el.querySelector('.input-layer-color');
                const weightInput = el.querySelector('.input-layer-weight');
                const opacityInput = el.querySelector('.input-layer-opacity');

                function updateSubLayerStyle() {
                    item.color = colorInput.value;
                    item.weight = parseInt(weightInput.value, 10);
                    item.opacity = parseInt(opacityInput.value, 10) / 100;

                    el.querySelector('.lbl-layer-color').textContent = item.color;
                    el.querySelector('.lbl-layer-weight').textContent = `${item.weight}px`;
                    el.querySelector('.lbl-layer-opacity').textContent = `${Math.round(item.opacity * 100)}%`;

                    item.layer.setStyle({
                        color: item.color,
                        weight: item.weight,
                        opacity: item.opacity,
                        fillColor: item.color,
                        fillOpacity: item.opacity * 0.4
                    });
                    item.layer.eachLayer((sub) => {
                        if (sub instanceof L.CircleMarker) {
                            sub.setStyle({ fillColor: item.color, fillOpacity: item.opacity });
                        }
                    });
                }

                colorInput.addEventListener('input', updateSubLayerStyle);
                weightInput.addEventListener('input', updateSubLayerStyle);
                opacityInput.addEventListener('input', updateSubLayerStyle);

                // 削除
                el.querySelector('.btn-remove-layer').addEventListener('click', () => {
                    map.removeLayer(item.layer);
                    importedLayers = importedLayers.filter(l => l.id !== item.id);
                    renderLayerList();
                    showToast(`${item.name} を削除しました`, 'info');
                });

                container.appendChild(el);
            });

            lucide.createIcons();
        }

        function getExportFilename(extension) {
            let date = new Date();
            if (trackPoints.length > 0 && trackPoints[0].timestamp) {
                date = new Date(trackPoints[0].timestamp);
            }
            const pad = (n) => String(n).padStart(2, '0');
            const Y = date.getFullYear();
            const M = pad(date.getMonth() + 1);
            const D = pad(date.getDate());
            const h = pad(date.getHours());
            const m = pad(date.getMinutes());
            const s = pad(date.getSeconds());
            return `track_${Y}${M}${D}_${h}${m}${s}.${extension}`;
        }

        function generateGpxXml() {
            const timeStr = trackPoints.length > 0 ? trackPoints[0].timestamp : new Date().toISOString();
            let xml = `<?xml version="1.0" encoding="UTF-8"?>\n`;
            xml += `<gpx version="1.1" creator="GPS Tracker App" xmlns="http://www.topografix.com/GPX/1/1">\n`;
            xml += `  <metadata>\n    <name>GPS Track Export</name>\n    <time>${timeStr}</time>\n  </metadata>\n`;
            xml += `  <trk>\n    <name>Recorded Track</name>\n    <trkseg>\n`;
            trackPoints.forEach(p => {
                xml += `      <trkpt lat="${p.lat}" lon="${p.lng}">\n`;
                if (p.alt) xml += `        <ele>${p.alt.toFixed(1)}</ele>\n`;
                if (p.timestamp) xml += `        <time>${p.timestamp}</time>\n`;
                if (p.speed) xml += `        <extensions><speed>${(p.speed / 3.6).toFixed(2)}</speed></extensions>\n`;
                xml += `      </trkpt>\n`;
            });
            xml += `    </trkseg>\n  </trk>\n</gpx>`;
            return xml;
        }

        function generateKmlXml() {
            const cleanHex = trackStyle.color.replace('#', '');
            const kmlAlpha = Math.round(trackStyle.opacity * 255).toString(16).padStart(2, '0');
            const kmlColor = `${kmlAlpha}${cleanHex.substring(4, 6)}${cleanHex.substring(2, 4)}${cleanHex.substring(0, 2)}`;

            let xml = `<?xml version="1.0" encoding="UTF-8"?>\n`;
            xml += `<kml xmlns="http://www.opengis.net/kml/2.2">\n  <Document>\n    <name>GPS Recorded Track</name>\n`;
            xml += `    <Style id="trackStyle">\n      <LineStyle>\n        <color>${kmlColor}</color>\n        <width>${trackStyle.weight}</width>\n      </LineStyle>\n    </Style>\n`;
            xml += `    <Placemark>\n      <name>Track Line</name>\n      <styleUrl>#trackStyle</styleUrl>\n      <LineString>\n        <coordinates>\n`;
            trackPoints.forEach(p => {
                xml += `          ${p.lng},${p.lat},${p.alt || 0}\n`;
            });
            xml += `        </coordinates>\n      </LineString>\n    </Placemark>\n  </Document>\n</kml>`;
            return xml;
        }

        function exportTrack(type) {
            if (trackPoints.length === 0) {
                showToast('保存する移動軌跡が記録されていません', 'info');
                return;
            }
            const filename = getExportFilename(type);
            const content = type === 'gpx' ? generateGpxXml() : generateKmlXml();
            const mime = type === 'gpx' ? 'application/gpx+xml' : 'application/vnd.google-earth.kml+xml';

            const blob = new Blob([content], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`${filename} をダウンロードしました`, 'success');
        }

        async function shareTrackFile() {
            if (trackPoints.length === 0) {
                showToast('共有する移動軌跡が記録されていません', 'info');
                return;
            }
            const filename = getExportFilename('gpx');
            const gpxXml = generateGpxXml();
            const file = new File([gpxXml], filename, { type: 'application/gpx+xml' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        title: 'GPS 軌跡データ',
                        text: `GPS トラッカーの移動ログ (${filename})`,
                        files: [file]
                    });
                    showToast('共有が完了しました', 'success');
                } catch (e) {
                    if (e.name !== 'AbortError') showToast('共有に失敗しました', 'error');
                }
            } else {
                exportTrack('gpx');
                showToast('端末共有がサポートされていないため、直接ダウンロードしました', 'info');
            }
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.warn('WakeLock warning:', err);
                }
            }
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        function showConfirm(title, message, onOk) {
            const modal = document.getElementById('confirm-modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').textContent = message;

            const btnOk = document.getElementById('modal-btn-ok');
            const btnCancel = document.getElementById('modal-btn-cancel');

            const handleOk = () => {
                cleanup();
                onOk();
            };
            const handleCancel = () => {
                cleanup();
            };
            const cleanup = () => {
                modal.classList.add('hidden');
                btnOk.removeEventListener('click', handleOk);
                btnCancel.removeEventListener('click', handleCancel);
            };

            btnOk.addEventListener('click', handleOk);
            btnCancel.addEventListener('click', handleCancel);
            modal.classList.remove('hidden');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bg = 'bg-slate-900 border-slate-700 text-slate-200';
            let icon = 'info';
            if (type === 'success') {
                bg = 'bg-emerald-950/90 border-emerald-600/70 text-emerald-200';
                icon = 'check-circle-2';
            } else if (type === 'error') {
                bg = 'bg-rose-950/90 border-rose-600/70 text-rose-200';
                icon = 'alert-triangle';
            }

            toast.className = `p-3 rounded-xl border shadow-xl backdrop-blur-md flex items-center gap-2.5 text-xs transition-all duration-300 translate-y-4 opacity-0 pointer-events-auto ${bg}`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 shrink-0"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                }, 300);
            }, 3500);
        }
    </script>
</body>
</html>
